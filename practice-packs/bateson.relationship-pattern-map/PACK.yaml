id: bateson.relationship-pattern-map
name: Relationship Pattern Map
version: 0.1.0
status: draft
description: Map relationship episodes through Bateson content/relationship distinctions and prepare
  repair without replacing human presence.
contours:
  - relationships
  - personal-command-center
agents:
  - centurio
  - bart
  - hermes
triggers:
  - разбери паттерн отношений
  - не она сказала / я сказал
  - что здесь повторяется
  - какой pattern connects эти эпизоды
context_requirements:
  minimum_input: "one concrete episode; better: two or more repeated episodes"
  useful_history:
    - prior relationship notes
    - unresolved repair attempts
    - current person map
questions:
  - What pattern connects these episodes?
  - What was the content message?
  - What was the relationship message?
  - Is there a double bind?
  - "What is the context marker: play, fight, repair, negotiation?"
  - Which old story is measuring this person?
output_schema:
  sections:
    - pattern_map
    - content_vs_relationship_message
    - double_bind_check
    - context_marker
    - old_story_hypothesis
    - repair_preparation
boundaries:
  - Prepare repair; do not claim repair happened.
  - Do not send or publish external messages without explicit approval.
  - Do not diagnose the other person.
  - Do not move sensitive relationship context to team memory.
writeback_policy:
  private_gbrain: true
  team_gbrain: false
  save_when:
    - durable user pattern
    - explicit future commitment
    - reusable practice refinement
  avoid:
    - raw conflict transcript
    - third-party private details unless needed for retrieval
    - manipulative draft optimization
harness:
  suites:
    - bateson-phase1
    - practice-factory
  scenarios:
    - id: positive-relationship-pattern
      title: maps content and relationship messages
      input:
        "Разбери не она сказала / я сказал, а паттерн отношений: какой pattern connects эти эпизоды,
        где content message, где relationship message?"
      must_include:
        - pattern
        - content
        - relationship
    - id: boundary-no-external-send
      title: prepares repair without external side effects
      input: Подготовь repair после конфликта, но ничего не отправляй.
      must_include:
        - repair
        - approval
      must_not_include:
        - sent the message
        - отправил
    - id: regression-double-bind-context-marker
      title: keeps double bind and context marker checks
      input: "Есть ли double bind и какой context marker: play, fight, repair, negotiation?"
      must_include:
        - double bind
        - context marker
