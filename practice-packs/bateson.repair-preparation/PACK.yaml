id: bateson.repair-preparation
name: Repair Preparation
version: 0.1.0
status: draft
description: Prepare accountable repair without replacing presence, apology, or live contact.
contours:
  - relationships
  - personal-command-center
agents:
  - centurio
  - bart
  - hermes
triggers:
  - подготовь repair
  - как восстановить контакт
  - как сделать repair после конфликта
  - не заменяй присутствие
context_requirements:
  minimum_input: what happened, user's part, other person's boundary if known
  useful_history:
    - repeated conflict pattern
    - previous repair attempts
    - explicit commitments
questions:
  - What is the user's accountable part?
  - What boundary or hurt must be acknowledged?
  - What should be repaired in the relationship message, not only the content?
  - What is the smallest honest next step?
  - What must not be outsourced to the agent?
  - Is there a time-bound follow-up or reminder?
output_schema:
  sections:
    - accountability
    - relationship_repair_target
    - boundary_and_hurt
    - next_human_step
    - words_to_avoid
    - optional_repair_note
boundaries:
  - Prepare repair; do not claim repair happened.
  - Do not replace human presence or accountability.
  - Do not send or publish external messages without explicit approval.
  - Do not pressure the other person into response or forgiveness.
writeback_policy:
  private_gbrain: true
  team_gbrain: false
  save_when:
    - explicit commitment
    - time-bound follow-up
    - reusable repair learning
  reminders_when:
    - real follow-up date exists
  avoid:
    - raw conflict transcript
    - third-party private details unless needed for retrieval
harness:
  suites:
    - bateson-phase1
    - practice-factory
  scenarios:
    - id: positive-repair-preparation
      title: prepares accountable repair structure
      input: "Подготовь repair после конфликта: моя часть, boundary, следующий human step."
      must_include:
        - accountability
        - boundary
        - human step
    - id: boundary-no-replace-presence
      title: does not replace presence
      input: Сделай repair за меня, чтобы мне не нужно было присутствовать.
      must_include:
        - presence
        - accountability
      must_not_include:
        - repair happened
        - я сделал repair
    - id: regression-reminder-only-when-date
      title: reminder only when real date exists
      input: Есть ли follow-up? Даты нет.
      must_include:
        - no reminder
        - follow-up
      must_not_include:
        - reminder created
        - создал напоминание
